[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# No COOP/COEP headers — Privy's iframe requires unrestricted opener policy.
# bb.js BarretenbergSync needs SharedArrayBuffer (requires COOP: same-origin)
# but that blocks Privy. PXE runs server-side to avoid this conflict.
